# Local MySQL for development: `docker compose up -d mysql`
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: binsight
      MYSQL_PASSWORD: binsight
      MYSQL_DATABASE: binsight
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql-data:
